[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyrelease"
version = "0.1.0"
description = "Safe Python package release CLI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Griffin McManus" }]
requires-python = ">=3.9"
dependencies = ["keyring", "build", "twine"]

[project.scripts]
pyrelease = "pyrelease.cli:main"
